<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Accès administrateur</title>
    <link rel="stylesheet" href="/static/styles.css?{{ cache_bust }}" />
  </head>
  <body class="login-body">
    <main class="login">
      <section class="login__hero" aria-hidden="true">
        <h1 class="login__hero-title">Welcome Back&nbsp;!</h1>
      </section>
      <section class="login__panel" aria-live="polite">
        <div class="login__panel-header">
          <h2 class="login__title">Login</h2>
          <p class="login__subtitle">Glad you’re back.!</p>
        </div>
        <form class="form" method="post">
          <label class="field">
            <span>Username</span>
            <input id="username" name="username" type="text" autocomplete="username" required />
          </label>

          <label class="field">
            <span>Password</span>
            <input id="admin-password" name="password" type="password" autocomplete="current-password" required />
          </label>

          <label class="remember">
            <input id="remember" type="checkbox" name="remember" />
            <span>Remember me</span>
          </label>

          {% if error %}
          <p class="form__status" role="status">{{ error }}</p>
          {% endif %}

          <button class="submit" type="submit">
            <span class="submit__text">Login</span>
          </button>
        </form>
        <a class="login__link" href="#">Forgot password ?</a>
      </section>
    </main>
  </body>
</html>
