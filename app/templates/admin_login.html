<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Accès administrateur</title>
    <link rel="stylesheet" href="/static/styles.css?{{ cache_bust }}" />
  </head>
  <body class="login-body">
    <main class="login">
      <section class="login__illustration" aria-hidden="true">
        <img src="/static/illustration-login.svg" alt="" />
      </section>
      <section class="login__panel" aria-live="polite">
        <h1 class="login__title">Accès administrateur</h1>
        <p class="login__subtitle">Connexion requise pour consulter les données.</p>
        <form class="form" method="post">
          <label class="field">
            <span>Identifiant</span>
            <input id="username" name="username" type="text" autocomplete="username" required />
          </label>

          <label class="field">
            <span>Mot de passe</span>
            <input id="admin-password" name="password" type="password" autocomplete="current-password" required />
          </label>

          {% if error %}
          <p class="form__status" role="status">{{ error }}</p>
          {% endif %}

          <button class="submit" type="submit">
            <span class="submit__text">Se connecter</span>
          </button>
        </form>
      </section>
      <section class="login__illustration" aria-hidden="true">
        <img src="/static/illustration-login.svg" alt="" />
      </section>
    </main>
  </body>
</html>
