version: "3.9"

services:
  nginx:
    build:
      context: ./nginx
    container_name: securityupdate_nginx
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/entrypoint.sh:/docker-entrypoint.d/10-generate-cert.sh:ro
    restart: unless-stopped
    networks:
      - security_net

  app:
    build:
      context: ./app
    container_name: securityupdate_app
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: securityupdate
      DB_USER: securityupdate
      DB_PASSWORD: securityupdate
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - security_net

  db:
    image: postgres:15-alpine
    container_name: securityupdate_db
    environment:
      POSTGRES_DB: securityupdate
      POSTGRES_USER: securityupdate
      POSTGRES_PASSWORD: securityupdate
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    networks:
      - security_net

networks:
  security_net:
    driver: bridge

volumes:
  db_data:
