version: "3.9"

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: securityupdate_nginx
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - security_net

  app:
    build:
      context: ./app
    container_name: securityupdate_app
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: securityupdate
      DB_USER: securityupdate
      DB_PASSWORD: securityupdate
    depends_on:
      - db
    networks:
      - security_net

  db:
    image: postgres:15-alpine
    container_name: securityupdate_db
    environment:
      POSTGRES_DB: securityupdate
      POSTGRES_USER: securityupdate
      POSTGRES_PASSWORD: securityupdate
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - security_net

  menu:
    image: alpine:3.19
    container_name: securityupdate_menu
    command: ["sh", "-c", "chmod +x /menu/menu.sh && /menu/menu.sh"]
    volumes:
      - ./menu/menu.sh:/menu/menu.sh:ro
    networks:
      - security_net

  mailu-front:
    image: ghcr.io/mailu/nginx:2.0
    container_name: securityupdate_mailu_front
    env_file: ./mailu/mailu.env
    depends_on:
      - mailu-redis
      - mailu-imap
      - mailu-smtp
      - mailu-webmail
      - mailu-admin
    ports:
      - "8081:80"
      - "8025:25"
      - "8465:465"
      - "8587:587"
      - "8110:110"
      - "8995:995"
      - "8143:143"
      - "8993:993"
    restart: unless-stopped
    networks:
      - mailu_net

  mailu-redis:
    image: redis:7-alpine
    container_name: securityupdate_mailu_redis
    restart: unless-stopped
    networks:
      - mailu_net

  mailu-imap:
    image: ghcr.io/mailu/dovecot:2.0
    container_name: securityupdate_mailu_imap
    env_file: ./mailu/mailu.env
    restart: unless-stopped
    networks:
      - mailu_net

  mailu-smtp:
    image: ghcr.io/mailu/postfix:2.0
    container_name: securityupdate_mailu_smtp
    env_file: ./mailu/mailu.env
    restart: unless-stopped
    networks:
      - mailu_net

  # Webmail: choisir UNE seule image.
  # Option recommandée: SnappyMail (Mailu 2.0) sur GHCR
  mailu-webmail:
    image: ghcr.io/mailu/roundcube:2.0
    image: ghcr.io/mailu/snappymail:2.0
    container_name: securityupdate_mailu_webmail
    env_file: ./mailu/mailu.env
    restart: unless-stopped
    networks:
      - mailu_net

  mailu-admin:
    image: ghcr.io/mailu/admin:2.0
    container_name: securityupdate_mailu_admin
    env_file: ./mailu/mailu.env
    restart: unless-stopped
    networks:
      - mailu_net

networks:
  security_net:
    driver: bridge
  mailu_net:
    driver: bridge

volumes:
  db_data:
