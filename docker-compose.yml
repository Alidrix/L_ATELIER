version: "3.9"

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: securityupdate_nginx
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/entrypoint.sh:/docker-entrypoint.d/10-generate-cert.sh:ro
    restart: unless-stopped
    networks:
      - security_net

  app:
    build:
      context: ./app
    container_name: securityupdate_app
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: securityupdate
      DB_USER: securityupdate
      DB_PASSWORD: securityupdate
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - security_net

  db:
    image: postgres:15-alpine
    container_name: securityupdate_db
    environment:
      POSTGRES_DB: securityupdate
      POSTGRES_USER: securityupdate
      POSTGRES_PASSWORD: securityupdate
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    networks:
      - security_net

  menu:
    image: alpine:3.19
    container_name: securityupdate_menu
    command: ["sh", "-c", "chmod +x /menu/menu.sh && /menu/menu.sh"]
    volumes:
      - ./menu/menu.sh:/menu/menu.sh:ro
    restart: unless-stopped
    networks:
      - security_net

  poste:
    image: analogic/poste.io:latest
    container_name: securityupdate_posteio
    hostname: mail.example.com
    environment:
      TZ: Europe/Paris
    ports:
      - "8080:80"
      - "8443:443"
      - "25:25"
      - "110:110"
      - "143:143"
      - "465:465"
      - "587:587"
      - "993:993"
      - "995:995"
      - "4190:4190"
    volumes:
      - poste_data:/data
    restart: unless-stopped

networks:
  security_net:
    driver: bridge

volumes:
  db_data:
  poste_data:
